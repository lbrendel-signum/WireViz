[project]
name = "wireviz"
version = "0.6.2"
description = "Add your description here"
readme = "docs/README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "graphviz>=0.21",
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "typer>=0.27.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default argument (common in typer, acceptable here)
]

[tool.ruff.lint.isort]
known-first-party = ["wireviz"]

[project.scripts]
wireviz = "wireviz.main:main"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.uv]
package = true

[tool.poe.tasks]
release = "semantic-release -c release.toml version"

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wireviz"
module-root = "src"